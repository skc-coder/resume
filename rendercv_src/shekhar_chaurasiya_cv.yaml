    detailed_technical_skills:
      - label: Discrete & Foundational Math
        details: "Deep conceptual and problem-solving mastery in **Discrete Mathematics** (Mathematical Logic, Propositional & Predicate Calculus, Set Theory, Relations & Functions, Combinatorics, Graph Theory, and Recurrence Relations), **Linear Algebra**, and **Group Theory** (Abstract Algebra). Applied mathematical proof techniques and discrete structures directly to algorithmic analysis, gate logic verification, and GATE CS problem solving."
      - label: C & Modern C++
        details: "**Theoretical & Core Concepts:** Object-Oriented Programming (OOP) paradigms (polymorphic class hierarchies, inheritance, encapsulation), custom data structures, manual memory management (`malloc`/`free`, pointers, stack allocation), templates, and operator overloading. **Practical Usage:** Developed low-level parsing engines in C (Infix-to-Postfix converter and stack-based arithmetic evaluator) and backtracking algorithms (Sudoku Solver engine)."
      - label: Python & Automation Scripting
        details: "**Theoretical & Practical Expertise:** Proficient in standard library modules, file handling, regular expressions, JSON parsing, PyDrive/Google Drive API integration, and Telegram Bot API. **Practical Usage:** Built cloud backup automation pipelines (`telegram-to-drive`), web scraping tools (`BeautifulSoup`), batch downloaders, logic evaluation tools, and task management CLI utilities."
      - label: Browser Extension Engineering
        details: "**Practical Usage (Manifest V3 & JavaScript):** Developed custom Chromium extensions (`ytmaster` / FocusTube, `webtools`) to enhance web navigation, automate hotkey search focusing, redirect image search providers, and eliminate video distractions."
      - label: Linux Systems Administration
        details: "**Practical Usage (Fedora Workstation):** Operating **Fedora Linux Workstation** as primary personal OS. Engineered custom `Bash` automation scripts and `cron` jobs for system maintenance, backup execution, desktop environment workflows, and terminal productivity (`zsh`, `Vim`/`Emacs`, `grep`, `find`, `sed`, `awk`)."
      - label: Database Management & SQL
        details: "**Academic Knowledge & Fundamentals:** Solid theoretical understanding of Relational Database Management Systems (RDBMS), Entity-Relationship (ER) modeling, 1NF to 3NF/BCNF normalization, Relational Algebra, ACID properties, and basic SQL query execution."
      - label: Developer Tools & Workflows
        details: "**Practical Usage:** Daily usage of `Git` and `GitHub` for version control, `Typst` for typesetting technical documentation, markdown vault notes, and modal text editors."

    projects:
      - name: GATE Exam Mock Test Interface & Portal Engine
        summary: Web Application | JavaScript, HTML5, Local Engine
        highlights:
          - Built a custom offline-first mock test interface mirroring the official GATE examination environment for personal exam practice and simulation.
          - Implemented interactive virtual keypad controls, question palette status navigation (Attempted, Marked for Review, Unattempted), countdown timer management, and real-time score analytics.
          - Enabled zero-latency offline test execution without relying on external server connectivity.

      - name: Automated Test Series Data Pipeline & Archival Engine
        summary: Data Engineering & Archival | Python, JSON Data Pipeline
        highlights:
          - Developed an automated data extraction and JSON indexing pipeline to structure and archive high-volume test series content for offline revision.
          - Built automated scripts (`download_all_tests.py`, `redownload_all_tests.py`) for batch processing, image asset caching, and structured schema formatting.

      - name: PyQHub -- University Semester PYQ Platform
        summary: Web Application | TypeScript, Web Architecture
        highlights:
          - Developed a web repository platform to accumulate, organize, and search previous year semester exam papers across technical universities (RTU, AKTU, and others).
          - Implemented structured course/subject paper categorizations and fast search filtering to help university engineering students prepare for semester examinations.

      - name: WebTools Browser Extension
        summary: Chrome Extension | Manifest V3, JavaScript, Chrome Extension API
        highlights:
          - Engineered a Manifest V3 Chromium browser extension to optimize daily web browsing and search workflows.
          - Implemented global hotkey search bar focusing (instant '/' shortcut), automatic Brave Images to Google Images redirection, and popup configuration management via Chrome Storage API.

      - name: FocusTube (YT Master) Distraction-Free Extension
        summary: Chrome Extension | JavaScript, DOM Manipulation, YouTube API
        highlights:
          - Built a specialized YouTube productivity extension designed to eliminate recommendation algorithms, hide feed clutter, and provide customizable UI element toggles.
          - Utilized Content Scripts injected at `document_start` and background Service Workers for zero-flicker UI modification.

      - name: Telegram to Google Drive Automated Cloud Pipeline
        summary: Cloud Automation & System Scripting | Python, Telegram API, PyDrive
        highlights:
          - Architected an automated cloud ingestion pipeline in **Python** that intercepts media files and document attachments from Telegram channels and streams them directly into **Google Drive** storage.
          - Integrated Google Drive OAuth2 authentication and PyDrive API to manage file upload chunks, remote directory creation, and duplicate file prevention.

      - name: Infix to Postfix Converter & Expression Calculator Engine
        summary: Systems & Data Structures | C Language, Memory Management
        highlights:
          - Designed and implemented a low-level mathematical expression parsing engine in **C** that converts arithmetic expressions from Infix notation to Postfix (Reverse Polish Notation) using custom Stack structures.
          - Built expression evaluation logic handling full operator precedence (parentheses, exponentiation, multiplication, division, addition, subtraction).

      - name: Boolean Truth Table & Logic Gate Generator
        summary: Computer Logic & Discrete Math | Python, Logic Gates
        highlights:
          - Developed an automated Boolean logic truth table evaluator capable of parsing arbitrary logical expressions (AND, OR, NOT, XOR, Implication).
          - Dynamically evaluated truth values across all 2^n variable combinations and formatted structured tabular outputs for digital logic verification.

      - name: Sudoku Solver Engine
        summary: Algorithms & Backtracking | C++, Constraint Satisfaction
        highlights:
          - Built an efficient 9x9 Sudoku puzzle solver using recursive **Backtracking** algorithms and constraint satisfaction logic in **C++**.

      - name: TODO CLI & Terminal Task Manager
        summary: CLI Utility | Python, Linux File I/O, JSON
        highlights:
          - Developed a lightweight command-line task management tool in **Python** tailored for fast Linux terminal execution without GUI overhead.

      - name: Fedora Linux Dotfiles & System Workflows
        summary: DevOps & System Configuration | Bash, Shell, Custom Configs
        highlights:
          - Maintained a modular repository of personal **Fedora Linux Workstation** dotfiles, shell aliases, Vim/Emacs configurations, desktop environment settings, and custom terminal shortcuts.

